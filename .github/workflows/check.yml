name: check
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # build/test.mjs 2b가 원본 커밋(13a3fe9)을 읽어요
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node build/build.mjs --check   # www/index.html이 src/와 같은지 (src만 고치고 빌드를 잊으면 실패)
      - run: python3 pc/test_store.py
      - run: node build/test.mjs            # playwright가 없으면 4~6(브라우저) 건너뜀
      - run: node build/compare.mjs         # 원본 대비 바뀐 모듈 목록 (로그 확인용)
      - run: npm ci --prefix tools --no-audit --no-fund   # 정적분석 도구(tree-sitter·ast-grep)
      - run: node tools/test.mjs           # 점검 도구 자체 검사(심어 둔 문제를 잡는지)
      - run: node tools/check.mjs --strict # 자기점검: 오류, 기준선(tools/baseline.json)보다 새로 생기거나 나빠진 위반(도구 코드 메타 점검 포함)이 있으면 실패
      - run: node tools/names.mjs --strict  # 이름 규칙(tools/naming.json): 모호한 지역 이름이 기준선보다 늘면 실패
      - run: node tools/wiring.mjs --strict # 포크 기능 배선 점검: 생성기 ↔ 기능 ↔ 생성된 게임(tools/play/games) 판정이 기준선보다 새로 생기면 실패
      - run: node tools/play/test.mjs      # 생성·QA·플레이 도구 자체 검사(playwright가 없으면 건너뜀)
      - run: node tools/play/combos.mjs --quick  # 프롬프트 조합 검증(게임 하나·기본 상황): 실제 index.html이 보낸 프롬프트의 깨짐·과잉·과소 보고
